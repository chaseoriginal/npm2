services:
  app:
    image: ${image}
    restart: ${restart}
    ports:
    - ${ext_httpport}:${ext_httpport}
    - ${ext_httpsport}:${ext_httpport}
    - ${ext_manport}:${ext_manport}
    environment:
      DB_SQLITE_FILE: ${DB_SQLITE_FILE}
      DISABLE_IPV6: 'true'
    volumes:
    - data:/data
    - /var/lib/docker/volumes/cus-npm2/letsencrypt:/etc/letsencrypt
volumes:
  data: null
